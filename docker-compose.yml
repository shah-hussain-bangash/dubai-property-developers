# Local development stack. Ports bind to 127.0.0.1 only.
# Usage: copy .env.example to .env, then `docker compose up --build`.
name: dubai-real-estate-ai

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dubai_ai}:${POSTGRES_PASSWORD:-dubai_ai_local}@postgres:5432/${POSTGRES_DB:-dubai_ai}
  REDIS_URL: redis://redis:6379/0
  READINESS_CHECKS_REQUIRED: "true"
  AUTH_MODE: ${AUTH_MODE:-dev}
  SECRET_KEY: ${SECRET_KEY:-change-me-local-development-only}
  ENABLE_DEV_ROUTES: ${ENABLE_DEV_ROUTES:-true}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-mock}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dubai_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dubai_ai_local}
      POSTGRES_DB: ${POSTGRES_DB:-dubai_ai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./apps/dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
