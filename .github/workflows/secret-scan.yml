name: Credential Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  credential-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks/gitleaks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --show-error --silent --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks/download.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks/download.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks/download.tar.gz" --directory "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Verify exceptions and redaction
        run: python3 scripts/maintenance/check_secret_scan.py "$GITLEAKS_BINARY"
      - name: Scan complete checked-out Git history
        run: '"$GITLEAKS_BINARY" git . --log-opts=--all --config=.gitleaks.toml --redact=100 --no-banner --report-format=json --report-path=secret-scan-results.json'
      - name: Upload redacted scanner report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: credential-scan-redacted
          path: secret-scan-results.json
          retention-days: 7
          if-no-files-found: ignore
