name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,documents]"
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy agents core tools integrations schemas database knowledge workflows apps/api apps/worker
      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=xml --cov-report=term
      - name: Alembic offline SQL
        run: python -m alembic upgrade head --sql > /dev/null
      - name: Dependency audit
        run: python -m pip_audit --progress-spinner off

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dubai_ai
          POSTGRES_PASSWORD: dubai_ai_ci
          POSTGRES_DB: dubai_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dubai_ai" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dubai_ai:dubai_ai_ci@localhost:5432/dubai_ai
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,documents]"
      - name: Migrate (fresh CI database)
        run: python -m alembic upgrade head
      - name: Seed fictional demo data
        run: python -m database.seeds.load_demo
        env:
          ENVIRONMENT: test
      - name: Integration tests
        run: python -m pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: cp .env.example .env && docker compose config --quiet
