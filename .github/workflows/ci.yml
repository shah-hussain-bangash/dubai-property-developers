name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,documents]"
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy agents core tools integrations schemas database knowledge workflows apps/api apps/worker
      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=xml --cov-report=term --junitxml=backend-results.xml
      - name: Summarize test results
        if: always()
        run: python scripts/maintenance/summarize_test_report.py backend-results.xml --label "Backend (Python ${{ matrix.python }})" --coverage coverage.xml
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-python-${{ matrix.python }}
          path: |
            backend-results.xml
            coverage.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Alembic offline SQL
        run: python -m alembic upgrade head --sql > /dev/null
      - name: Dependency audit
        run: python -m pip_audit --progress-spinner off

  backend-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dubai_ai
          POSTGRES_PASSWORD: dubai_ai_ci
          POSTGRES_DB: dubai_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dubai_ai" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dubai_ai:dubai_ai_ci@localhost:5432/dubai_ai
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION_TESTS: "1"
      RUN_EXECUTION_LEDGER_DB_TESTS: "1"
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,documents]"
      - name: Migrate (fresh CI database)
        run: python -m alembic upgrade head
      - name: Seed fictional demo data
        run: python -m database.seeds.load_demo
        env:
          ENVIRONMENT: test
      - name: Prepare fictional integration records
        run: python -m tests.integration.prepare_ci
      - name: Create isolated execution-ledger database
        run: docker exec ${{ job.services.postgres.id }} createdb --username=dubai_ai dubai_ai_test
      - name: Migrate isolated execution-ledger database
        run: python -m alembic upgrade 0008_tool_request_fingerprint
        env:
          DATABASE_URL: postgresql+asyncpg://dubai_ai:dubai_ai_ci@localhost:5432/dubai_ai_test
      - name: Integration tests
        run: python -m pytest tests/integration --junitxml=integration-results.xml
      - name: Summarize test results
        if: always()
        run: python scripts/maintenance/summarize_test_report.py integration-results.xml --label "Database integration (Python ${{ matrix.python }})"
      - name: Upload database integration report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-python-${{ matrix.python }}
          path: integration-results.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Reject unexpected integration skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          skipped = ET.parse("integration-results.xml").findall(".//testcase/skipped")
          unexpected = [case.attrib for case in skipped if case.get("type") != "pytest.xfail"]
          assert not unexpected, f"Unexpected integration skips: {unexpected}"
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=frontend-results.xml
      - name: Summarize test results
        if: always()
        run: python3 ../../scripts/maintenance/summarize_test_report.py frontend-results.xml --label Frontend
      - name: Upload frontend report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-tests
          path: apps/dashboard/frontend-results.xml
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate docker compose file
        run: cp .env.example .env && docker compose config --quiet

  api-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --tag dubai-api-ci --file apps/api/Dockerfile .
      - name: Verify runtime, non-root user and dependencies
        run: |
          docker run --rm --network none --entrypoint python dubai-api-ci -c "import os, sys; assert sys.version_info[:2] == (3, 15); assert os.getuid() != 0"
          docker run --rm --network none --entrypoint python dubai-api-ci -m pip check
      - name: Verify container startup and health
        run: |
          docker run --detach --name api-smoke --network none --env ENVIRONMENT=test dubai-api-ci
          for _ in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api-smoke)
            if [ "$status" = healthy ]; then
              docker exec api-smoke python -c "import json, urllib.request; response = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert response['status'] == 'ok'; assert response['environment'] == 'test'"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' api-smoke)" != true ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs api-smoke || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force api-smoke || true

  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Run Windows setup
        shell: powershell
        run: .\scripts\setup\setup-windows.ps1
      - name: Verify installed environment
        shell: powershell
        run: |
          & .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Backend dependencies are inconsistent." }
          if (-not (Test-Path ".env")) { throw "Local environment template was not copied." }
          Push-Location apps/dashboard
          try {
            npm.cmd ls --depth=0
            if ($LASTEXITCODE -ne 0) { throw "Dashboard dependencies are inconsistent." }
          } finally {
            Pop-Location
          }

  credential-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --show-error --silent --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks/download.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks/download.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks/download.tar.gz" --directory "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Verify exceptions and redaction
        run: python3 scripts/maintenance/check_secret_scan.py "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Scan complete checked-out Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --config=.gitleaks.toml --redact=100 --no-banner --report-format=json --report-path=secret-scan-results.json'
      - name: Upload redacted scanner report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: credential-scan-redacted
          path: secret-scan-results.json
          retention-days: 7
          if-no-files-found: ignore

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install verified workflow validator
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --show-error --silent --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint/download.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/download.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint/download.tar.gz" --directory "$RUNNER_TEMP/actionlint" actionlint
      - name: Validate all GitHub workflows and shell steps
        run: |
          command -v shellcheck
          "$RUNNER_TEMP/actionlint/actionlint" -color
